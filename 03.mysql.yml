- name: configure mysql
  hosts: mysql
  become: yes
  tasks:
    - name: enable mysql-8 module
      command: dnf module enable mysql:8.4 -y

    - name: install mysql server
      ansible.builtin.package:
        name: mysql-server
        state: present

    - name: start mysql service
      ansible.builtin.service:
        name: mysqld
        state: started
        enabled: yes

    # - name: setup MySQL root password
    #   community.mysql.mysql_user:
    #     name: root
    #     host: local
    #     password: "{{ mysql_root_password }}" # Remove this line if it's a fresh installation with no password
    #     check_implicit_admin: yes
    #     state: present

    - name: setup MySQL root password
      command: mysql_secure_installation --set-root-pass "{{ mysql_root_password }}"