- name: Configure cart server
  hosts: cart
  become: yes
  tasks:
    - name: disable default nodejs module
      command: dnf module disable nodejs -y

    - name: enable nodejs24
      command: dnf module enable nodejs:24 -y

    - name: install nodejs
      dnf:
        name: nodejs
        state: present
        
    - name: create roboshop system cart
      ansible.builtin.cart:
        name: roboshop
        create_home: false
        home: /app
        system: true
        shell: /sbin/nologin
        comment: "roboshop system cart"


    - name: remove existing app directory
      ansible.builtin.file:
        path: /app
        state: absent

    - name: remove cart.zip if already exists
      ansible.builtin.file:
        path: /tmp/cart.zip
        state: absent

    - name: create app directory
      ansible.builtin.file: 
        path: /app
        state: directory
    
    - name: download cart application
      ansible.builtin.get_url:
        url: "https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/cart-{{ app_version }}.zip"
        dest: /tmp/cart.zip
    
    - name: unzip cart application
      ansible.builtin.unarchive:
        src: /tmp/cart.zip
        dest: /app
        remote_src: yes
    
    - name: install nodejs dependencies
      community.general.npm:
      path: /app

    - name: configure cart systemd service
      ansible.builtin.template:
        src: cart.service.j2
        dest: /etc/systemd/system/cart.service
    
    - name: copy mongodb repo file
      ansible.builtin.copy:
        src: mongodb.repo
        dest: /etc/yum.repos.d/mongodb.repo

    - name: install mongodb client
      dnf: 
        name: mongodb-mongosh
        state: present

    - name: check progucts loded or not
      command: mongosh --host {{ mongodb_host }} --quiet --eval 'db.getSiblingDB("cart").products.countDocuments()' 

    - name: print product_count
      debug:
       msg: "{{ product_count }}"

    - name: load the products
      shell: mongosh --host "{{ mongodb_host }}" < /app/db/master-data.js
      when: product_count.stdout | int == 0

    - name: daemon reload
      systemd_service:
         daemon_reload: true

    - name: start and enable cart
      service:
        name: cart
        state: restarted
        enabled: yes