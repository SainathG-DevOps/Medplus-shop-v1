- name: Create EC2 instance
  hosts: localhost
  connection: local
  gather_facts: no
  vars:
      # to create instances $ansible-playbook roboshop.yaml -e instances=['mongodb', 'redis'] 
      # --> here enter what we want/ how many instances needed to create
      # Default action is create, to delete instances $ansible-playbook roboshop.yaml -e action=delete

    instances: ["mongodb", "redis", "mysql", "rabbitmq"]
    action: create
    domain_name: "gdops92.shop"
    ami_id: "ami-0055977a6e828a4f4"
  tasks:
  - name: Launch EC2 instance
    amazon.aws.ec2_instance:
        name: "roboshop-{{ item }}"
        instance_type: t3.micro
        image_id: "{{ ami_id }}"
        region: us-east-1
        security_groups: 
        - Medplus-common
        - "roboshop-{{ item }}"
    loop: "{{ instances }}"
    when: action == "create"
    register: ec2_output

